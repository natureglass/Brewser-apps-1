name: Build catalogue

# Extended storage repo (source "ext1", served at play1.brewser.io). Builds THIS
# repo's index-fragment.json + artifacts/ from its flat apps/<id>/ folders. This
# repo has NO catalogue.json of its own — the BASE repo (natureglass/Brewser-apps)
# owns the merged catalogue.json the Switch runtime reads. See docs/catalogue-v2.md.
#
# After the fragment is (re)built and committed, this repo's Pages deploy
# (pages.yml) republishes play1.brewser.io AND pings the base repo to re-merge
# the master catalogue — see the "Notify base repo" step in pages.yml. The base
# repo's scheduled safety-net converges anyway if that ping is ever missed.
#
# Fires on push to apps/** (the plugin's promote / edit / delete) and manual
# dispatch. The bot commit only touches index-fragment.json + artifacts/ (never
# apps/**), so it can't re-trigger this workflow — and a GITHUB_TOKEN commit
# wouldn't trigger workflows anyway.
on:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
  workflow_dispatch: {}

concurrency:
  group: build-catalogue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild + commit fragment (race-safe)
        run: |
          git config user.name  "brewser-catalogue-bot"
          git config user.email "brewser-catalogue-bot@users.noreply.github.com"
          # index-fragment.json + artifacts/ are a pure function of apps/, so each
          # attempt syncs to the latest main, rebuilds, and pushes; a concurrent
          # writer (e.g. the plugin's promote pushing straight to apps/) is picked
          # up on the next iteration. build_fragment.py fails LOUD on a >100 MiB
          # file (GitHub's hard per-file push limit) so it surfaces at intake.
          for i in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python scripts/build_fragment.py --source ext1
            git add -A -- index-fragment.json artifacts
            if git diff --cached --quiet; then
              echo "Fragment already up to date."
              exit 0
            fi
            git commit -q -m "fragment: rebuild from apps/"
            if git push origin HEAD:main; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push raced by another writer; retrying ($i)…"
            sleep $((RANDOM % 4 + 1))
          done
          echo "::error::fragment push failed after 5 attempts (persistent contention)."
          exit 1
